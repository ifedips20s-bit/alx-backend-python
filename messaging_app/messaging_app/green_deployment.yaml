apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging-app-green-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: messaging-app-green
  template:
    metadata:
      labels:
        app: messaging-app-green
    spec:
      containers:
      - name: messaging-app
        image: messaging_app:latest
        ports:
        - containerPort: 8000
